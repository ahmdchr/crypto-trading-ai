name: Hourly paper trade

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-wallet
  cancel-in-progress: false

jobs:
  paper-trade:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Scan markets and save encrypted paper wallet
        env:
          PAPER_WALLET_PASSPHRASE: ${{ secrets.PAPER_WALLET_PASSPHRASE }}
        run: bash cloud/github-run.sh
